<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title description">
  <title id="title">FTC hardware lab project boundary</title>
  <desc id="description">The FTC hardware lab repository contains an FtcRobotController module that students read but do not modify, and a TeamCode module where students create Level 2 OpModes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 650; }
      .detail { font-size: 17px; }
      .connector { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="800" height="720" rx="24" fill="#ffffff"/>

  <rect x="205" y="28" width="390" height="78" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="400" y="76" text-anchor="middle" class="heading">ftc-hardware-lab repository</text>

  <path class="connector" d="M315 106 V132 H205 V174"/>
  <path class="connector" d="M485 106 V132 H595 V174"/>

  <rect x="24" y="176" width="362" height="512" rx="20" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="205" y="216" text-anchor="middle" class="heading">FTC SDK</text>
  <text x="205" y="244" text-anchor="middle" class="detail">Read and reference</text>
  <text x="205" y="268" text-anchor="middle" class="detail">Do not modify</text>

  <rect x="66" y="304" width="278" height="82" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="205" y="353" text-anchor="middle" class="label">FtcRobotController</text>
  <path class="connector" d="M205 386 V438"/>
  <rect x="66" y="442" width="278" height="82" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="205" y="476" text-anchor="middle" class="label">Official sample</text>
  <text x="205" y="502" text-anchor="middle" class="label">OpModes</text>
  <text x="205" y="581" text-anchor="middle" class="detail">Use as examples</text>
  <text x="205" y="606" text-anchor="middle" class="detail">without editing them</text>

  <rect x="414" y="176" width="362" height="512" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="595" y="216" text-anchor="middle" class="heading">Student work</text>
  <text x="595" y="244" text-anchor="middle" class="detail">Create and edit here</text>

  <rect x="456" y="284" width="278" height="76" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="331" text-anchor="middle" class="label">TeamCode</text>
  <path class="connector" d="M595 360 V402"/>
  <rect x="456" y="406" width="278" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="595" y="443" text-anchor="middle" class="detail">org.firstinspires.ftc</text>
  <text x="595" y="469" text-anchor="middle" class="detail">.teamcode.level2</text>
  <path class="connector" d="M595 502 V544"/>
  <rect x="456" y="548" width="278" height="76" rx="12" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="595" y="594" text-anchor="middle" class="label">Your Level 2 OpModes</text>
</svg>
