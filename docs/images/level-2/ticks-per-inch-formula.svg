<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How to calculate ticks per inch</title>
  <desc id="desc">Ticks per wheel revolution divided by inches per wheel revolution equals ticks per inch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .formula { font: 600 19px Arial, sans-serif; fill: #0f172a; }
      .note { font: 18px Arial, sans-serif; fill: #334155; }
      .result { font: 700 26px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">From Encoder Ticks to Ticks per Inch</text>

  <rect x="55" y="90" width="500" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="305" y="126" text-anchor="middle" class="boxTitle">Ticks in one wheel revolution</text>
  <text x="305" y="168" text-anchor="middle" class="formula">TICKS_PER_MOTOR_REV</text>
  <text x="305" y="199" text-anchor="middle" class="formula">× DRIVE_GEAR_REDUCTION</text>
  <text x="305" y="228" text-anchor="middle" class="note">= TICKS_PER_WHEEL_REV</text>

  <rect x="645" y="90" width="500" height="150" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="895" y="126" text-anchor="middle" class="boxTitle">Inches in one wheel revolution</text>
  <text x="895" y="168" text-anchor="middle" class="formula">WHEEL_DIAMETER_INCHES × π</text>
  <text x="895" y="199" text-anchor="middle" class="note">= wheel circumference</text>
  <text x="895" y="228" text-anchor="middle" class="note">= INCHES_PER_WHEEL_REV</text>

  <line x1="305" y1="240" x2="480" y2="340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="895" y1="240" x2="720" y2="340" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="300" y="335" width="600" height="135" rx="20" fill="#16a34a"/>
  <text x="600" y="375" text-anchor="middle" class="result">TICKS_PER_WHEEL_REV</text>
  <text x="600" y="413" text-anchor="middle" class="result">÷ INCHES_PER_WHEEL_REV</text>
  <text x="600" y="451" text-anchor="middle" class="result">= TICKS_PER_INCH</text>

  <rect x="210" y="500" width="780" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="600" y="540" text-anchor="middle" class="boxTitle">Example: inches in one revolution of a 4-inch wheel</text>
  <text x="600" y="580" text-anchor="middle" class="formula">4.0 inches × π ≈ 12.57 inches per wheel revolution</text>
</svg>
