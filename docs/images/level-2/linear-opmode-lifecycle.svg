<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title description">
  <title id="title">LinearOpMode lifecycle</title>
  <desc id="description">Driver Station INIT, PLAY, and STOP actions trigger hardware initialization, waiting, the active loop, and safe shutdown in a LinearOpMode.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 21px; font-weight: 650; }
      .detail { font-size: 17px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 650; }
      .connector { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .trigger { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="820" rx="24" fill="#ffffff"/>

  <rect x="30" y="28" width="278" height="66" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="169" y="70" text-anchor="middle" class="heading">Driver Station</text>

  <rect x="356" y="28" width="514" height="66" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="613" y="70" text-anchor="middle" class="heading">LinearOpMode code</text>

  <rect x="58" y="132" width="222" height="92" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="169" y="169" text-anchor="middle" class="label">Select OpMode</text>
  <text x="169" y="198" text-anchor="middle" class="label">Press INIT</text>

  <rect x="394" y="122" width="438" height="112" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="613" y="160" text-anchor="middle" class="code">runOpMode() begins</text>
  <text x="613" y="190" text-anchor="middle" class="detail">Get configured hardware and</text>
  <text x="613" y="214" text-anchor="middle" class="detail">set safe initial outputs</text>
  <path class="trigger" d="M280 178 H390"/>

  <path class="connector" d="M613 234 V282"/>
  <rect x="394" y="286" width="438" height="92" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="613" y="325" text-anchor="middle" class="code">waitForStart()</text>
  <text x="613" y="353" text-anchor="middle" class="detail">Execution pauses here</text>

  <rect x="58" y="434" width="222" height="76" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="169" y="480" text-anchor="middle" class="label">Press PLAY</text>

  <path class="connector" d="M613 378 V424"/>
  <rect x="394" y="428" width="438" height="112" rx="14" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="613" y="468" text-anchor="middle" class="code">while (opModeIsActive())</text>
  <text x="613" y="498" text-anchor="middle" class="detail">Read inputs and command hardware</text>
  <text x="613" y="522" text-anchor="middle" class="detail">again and again</text>
  <path class="trigger" d="M280 472 H390"/>

  <path class="connector" d="M613 540 V602"/>
  <rect x="58" y="612" width="222" height="76" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="169" y="658" text-anchor="middle" class="label">Press STOP</text>

  <rect x="394" y="594" width="438" height="112" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="613" y="633" text-anchor="middle" class="code">opModeIsActive() is false</text>
  <text x="613" y="663" text-anchor="middle" class="detail">The loop ends and code returns</text>
  <text x="613" y="687" text-anchor="middle" class="detail">hardware outputs to a safe state</text>
  <path class="trigger" d="M280 650 H390"/>

  <rect x="394" y="750" width="438" height="42" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="613" y="777" text-anchor="middle" class="detail">The OpMode has finished</text>
  <path class="connector" d="M613 706 V746"/>
</svg>
